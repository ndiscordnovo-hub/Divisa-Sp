function menu(current){let used=new Set();let html='';for(const [name,ids] of groups){const chapters=ids.filter(id=>id==='inicio'||data.some(d=>d.id===id));if(!chapters.length)continue;html+=`<div class="nav-group">${name}</div>`;for(const id of chapters){used.add(id);html+=navItem(id,current)}}const rest=data.filter(d=>!used.has(d.id));if(rest.length){html+='<div class="nav-group">OUTRAS REGRAS</div>'+rest.map(d=>navItem(d.id,current)).join('')}$('#navigation').innerHTML=html}
function navItem(id,current){return `<a href="#${id}" class="nav-link ${id===current?'active':''}" ${id===current?'aria-current="page"':''}>${icon(icoFor(id),15)}<span>${esc(titleFor(id))}</span>${id===current?'<span class="chevron">›</span>':''}</a>`}

div><span class="section-eyebrow">02 / DURANTE O ROLEPLAY</span><h2>Cada ação tem suas regras${anchor('acoes')}</h2></div></div><div class="action-feature"><div class="action-symbol">${icon('roubos',28)}</div><div><span>ASSALTOS E ROUBOS</span><h3>Consulte antes de iniciar.</h3><p>Participantes, reféns, armamento e negociação.</p></div><a href="#roubos" aria-label="Consultar regras de assaltos e roubos">Ver condições ${icon('right',17)}</a></div><div class="secondary-topics">${quick('ilegal','Regras do ilegal')}${quick('policia','Procedimentos policiais')}${quick('safezones','Áreas protegidas')}</div></section><section class="doc-section" id="guia"><div class="reading-guide"><span class="guide-icon">${icon('info',20)}</span><div><h3>Uma dúvida muda o rumo da ação.</h3><p>Leia a seção completa e considere as condições de cada regra. Se ainda precisar de ajuda, procure a equipe de atendimento antes de começar.</p></div></div></section><section class="doc-section change-history" id="atualizacoes"><div class="section-head"><div><span class="section-eyebrow">TRANSPARÊNCIA</span><h2>Últimas alterações${anchor('atualizacoes')}</h2></div></div><div class="change-entry"><time datetime="2026-10-21">21 OUT 2026</time><div><strong>Um painel mais fácil de consultar</strong><p>Nova organização para celular e PC, contraste reforçado, ícones vermelhos, fichas de assaltos e links individuais das regras.</p><span class="change-tag">Melhorias do painel</span></div></div><p class="history-note">Esta atualização mudou a apresentação do painel. Os textos e limites das regras continuam em revisão pela administração.</p></section><div class="review-footnote">Textos de referência adaptados para a Divisa SP. Quantidades, valores e punições estão em revisão pela administração.</div>`}
function topic(id,n,title){const d=data.find(x=>x.id===id);return `<a class="premium-topic" href="#${id}"><div class="topic-top"><span class="topic-icon">${icon(icoFor(id),21)}</span><span class="topic-num">${n}</span></div><h3>${esc(title)}</h3><p>${esc(d.description)}</p><span class="topic-link">Consultar regras ${icon('right',15)}</span></a>`}
function anchor(id){return `<a class="heading-anchor" href="#${pageId()}/${id}" aria-label="Link para esta seção">#</a>`}
function pageId(){return decodeURIComponent(location.hash.slice(1).split('/')[0]||'inicio')}
function formatRule(text){const colon=text.indexOf(':');return colon>0&&colon<70?'<strong>'+esc(text.slice(0,colon+1))+'</strong>'+esc(text.slice(colon+1)):esc(text)}
function chapter(d){return d.sections.map((s,i)=>`<section class="doc-section" id="section-${i}"><h2>${esc(s.title)}${anchor('section-'+i)}</h2>${s.places?'<div class="places">'+s.places.map(p=>'<span>'+esc(p)+'</span>').join('')+'</div>':''}${s.sheet?sheet(s.sheet):''}${s.rules.map((r,j)=>`<article class="rule" id="rule-${i}-${j}"><span class="rule-no">${String(j+1).padStart(2,'0')}</span><div class="rule-text">${formatRule(r.text)}</div><a class="rule-share" href="#${d.id}/rule-${i}-${j}" aria-label="Link da regra ${j+1}: ${esc(s.title)}" title="Compartilhar esta regra">${icon('link',16)}<span>Link</span></a></article>`).join('')}</section>`).join('')}

function sheet(s){const fields=[['robbers','Assaltantes','personagem'],['police','Policiais','policia'],['hostages','Reféns','safezones'],['weapons','Armamento','ilegal'],['negotiation','Negociação','discord']];return `<div class="action-sheet"><div class="sheet-heading">${icon('roubos',21)}<div><strong>Condições da ação</strong><small>Proposta em revisão pela administração</small></div></div><dl class="action-fields">${fields.map(([k,label,ico])=>`<div class="action-field">${icon(ico,23)}<div><dt>${label}</dt><dd>${s[k]===undefined?'Não informado':esc(typeof s[k]==='boolean'?(s[k]?'Permitida':'Não permitida'):s[k])}</dd></div></div>`).join('')}</dl></div>`}

function pagination(id){const all=[{id:'inicio',title:'Introdução'},...data],n=all.findIndex(d=>d.id===id);return '<div class="pagination">'+(all[n-1]?`<a href="#${all[n-1].id}">${icon('left',19)}<div><small>Anterior</small><b>${esc(all[n-1].title)}</b></div></a>`:'')+(all[n+1]?`<a class="next" href="#${all[n+1].id}"><div><small>Próximo</small><b>${esc(all[n+1].title)}</b></div>${icon('right',19)}</a>`:'')+'</div>'}
function outline(){const headings=[...document.querySelectorAll('.doc-section h2')];$('#outline').innerHTML='<div class="outline-label">'+icon('list',13)+' NESTA PÁGINA</div><div class="outline-links">'+headings.map(h=>`<a href="#${pageId()}/${h.closest('.doc-section').id}" data-outline="${h.closest('.doc-section').id}">${esc(h.childNodes[0].textContent)}</a>`).join('')+'</div><div class="outline-note">DIVISA SP<br><span>Livro de regras da cidade</span><br>Versão em revisão</div>';observer?.disconnect();if(headings.length){observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){document.querySelectorAll('[data-outline]').forEach(a=>a.classList.toggle('current',a.dataset.outline===e.target.id))}},{rootMargin:'-90px 0px -60% 0px'});headings.forEach(h=>observer.observe(h.closest('.doc-section')))}}
function render(){let id=pageId(),d=data.find(x=>x.id===id);if(id!=='inicio'&&!d){$('#content').innerHTML='<h1>Página não encontrada</h1><p class="body-copy">Esse capítulo não existe.</p><a class="quick-link" href="#inicio">Voltar à introdução →</a>';$('#outline').innerHTML='';menu('');return}menu(id);$('#navigation').insertAdjacentHTML('beforeend','<div class="nav-group">NOVIDADES</div><a class="nav-link" href="#inicio/atualizacoes">'+icon('list',20)+'<span>Últimas alterações</span></a>');const title=d?d.title:'Central de regras';document.title=title+' | Divisa SP';$('#content').innerHTML=`<div class="breadcrumbs"><a href="#inicio">${icon('home',13)}</a><span>/</span><span>Livro de regras</span><span>/</span><span class="current">${esc(title)}</span></div><div class="page-heading"><h1>${esc(title)}</h1><button class="copy-button" id="copy-link" aria-label="Copiar link desta página">${icon('link',14)}<span>Copiar link</span></button></div><p class="page-subtitle">${esc(d?d.description:'Tudo o que você precisa saber para viver a Divisa SP.')}</p>${d?chapter(d):home()}${pagination(id)}<div class="page-bottom"><span>Divisa SP · Livro de regras</span><span class="review-status"><i></i> Conteúdo em revisão</span></div>`;$('#copy-link').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Link copiado')}catch{toast('Copie o endereço na barra do navegador')}};document.querySelectorAll('.rule-share').forEach(a=>a.addEventListener('click',()=>{navigator.clipboard?.writeText(a.href).then(()=>toast('Link da regra copiado')).catch(()=>toast('Abra a regra e copie o endereço'));}));outline();closeMenu();const target=decodeURIComponent(location.hash.slice(1).split('/')[1]||'');if(target&&document.getElementById(target))requestAnimationFrame(()=>document.getElementById(target).scrollIntoView());else window.scrollTo(0,0)}
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function buildIndex(){searchIndex=data.flatMap(d=>[{title:d.title,chapter:d.title,text:d.description,url:'#'+d.id},...d.sections.flatMap((s,i)=>[{title:s.title,chapter:d.title,text:s.places?.join(', ')||d.description,url:'#'+d.id+'/section-'+i},...s.rules.map((r,j)=>({title:s.title,chapter:d.title,text:r.text,url:'#'+d.id+'/rule-'+i+'-'+j})),...(s.sheet?[{title:s.title,chapter:d.title,text:Object.entries(s.sheet).map(([k,v])=>k+': '+v).join(' · '),url:'#'+d.id+'/section-'+i}]:[])])])}
function search(){const q=norm($('#search').value.trim());if(!q){$('#search-results').innerHTML='<p>Busque por uma regra, ação ou palavra-chave.</p>';return}const results=searchIndex.map((r,i)=>({r,i,score:(norm(r.text).includes(q)?2:0)+(norm(r.title).includes(q)?3:0)+(norm(r.chapter).includes(q)?1:0)})).filter(x=>x.score).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,35);$('#search-results').innerHTML=results.length?results.map(({r})=>{const pos=norm(r.text).indexOf(q),start=Math.max(0,pos-60),snippet=(start?'…':'')+r.text.slice(start,start+200)+(r.text.length>start+200?'…':'');return `<a class="search-result" href="${r.url}"><small>${esc(r.chapter)}</small><b>${esc(r.title)}</b><p>${esc(snippet)}</p></a>`}).join(''):'<p>Nenhuma regra encontrada. Tente outra palavra.</p>';document.querySelectorAll('.search-result').forEach(a=>a.onclick=()=>{$('#search-dialog').close();if(a.hash===location.hash)render()})}
function openSearch(){if(!$('#search-dialog').open)$('#search-dialog').showModal();$('#search').focus();search()}
$('#mobile').innerHTML=icon('menu',20)+'<span>Capítulos</span>';$('#space-icon').innerHTML=icon('book',19);$('#search-icon').innerHTML=icon('search',16);$('#modal-search-icon').innerHTML=icon('search',20);$('#mobile').onclick=()=>{const open=document.body.classList.toggle('menu-open');$('#mobile').setAttribute('aria-expanded',String(open));$('#mobile').setAttribute('aria-label',open?'Fechar capítulos':'Abrir capítulos')};$('#backdrop').onclick=closeMenu;$('#search-trigger').onclick=openSearch;$('#close-search').onclick=()=>$('#search-dialog').close();$('#search-dialog').onclick=e=>{if(e.target===$('#search-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};$('#search').oninput=search;$('#search').onkeydown=e=>{if(e.key==='Enter'){const first=$('.search-result');if(first){$('#search-dialog').close();if(location.hash===first.hash)render();else location.hash=first.hash}}};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeMenu()});window.addEventListener('hashchange',render);
data=[{"id": "discord", "number": 1, "title": "Regras do Discord", "icon": "MessageSquare", "description": "Normas de comportamento para os canais do Discord da Comunidade.", "sections": [{"id": "discord-geral", "title": "Regras Discord", "rules": [{"text": "Independente de qualquer regra colocada neste Livro, a Administração se reserva ao direito de orientar e/ou retirar qualquer jogador da comunidade, caso não se enquadre nos padrões previamente descritos."}, {"text": "Ao logar na Cidade, você concorda com as regras deste documento e concede o direito a sua voz e/ou imagem, na qual poderão ser utilizadas para produção de videoclipes e materiais direcionados às redes sociais e campanhas do servidor."}, {"text": "O contato com membros da Staff via ticket deve ser feito de forma clara e objetiva, explicando de início o motivo do contato e qual a sua dúvida ou necessidade, para que possamos agilizar o atendimento."}, {"text": "É estritamente proibido realizar qualquer tipo de divulgação em salas do Discord, com exceção daquelas destinadas especificamente à divulgação."}, {"text": "Proibido utilizar o canal de Clipes, sugestões, entre outros, para fins que não foram destinados."}, {"text": "Denúncias ou report de bugs devem ser feitos via ticket através de vídeos explicando o ocorrido."}, {"text": "Dentro do Discord, não é permitido nem tolerado qualquer forma de comportamento tóxico. Nenhum problema fora do RP deve ser levado para dentro do jogo, e vice-versa."}, {"text": "É estritamente proibido qualquer tipo de Flaming/Farpas nos canais de bate-papo."}, {"text": "É totalmente proibido qualquer tipo de xingamento pejorativo nos canais do Discord da cidade e até mesmo na cidade. Isso pode resultar em banimento permanente."}, {"text": "Fica totalmente proibida a apologia a Trapaças/Cheats, seja via postagens, mensagens ou no perfil."}]}]}, {"id": "primordiais", "number": 2, "title": "Regras Primordiais", "icon": "Scale", "description": "As regras fundamentais que regem toda a experiência de roleplay no servidor.", "sections": [{"id": "primordiais-geral", "title": "Fundamentos do Roleplay", "rules": [{"text": "Uma das regras essenciais para o servidor é o BOM SENSO. Os Administradores irão observar as situações que sejam desenroladas no RP, certificando sempre de esclarecer da melhor maneira possível. Mas, temos algumas normas que são principais e não será permitido a sua inadimplência."}, {"text": "A discriminação é expressamente proibida, todo e qualquer tipo de preconceito, abuso, racismo, homofobia, discurso de ódio e qualquer tipo de flaming."}, {"text": "Proibido roubo/assalto de veículos de servidores públicos em serviço (polícia, hospital e mecânica) previamente caracterizados."}, {"text": "É proibido o metagaming, RDM, VDM, Combat Logging, Power-RP, Power Gaming, falta de amor à vida, Anti-RP, uso de aplicativos externos para benefícios (seja ele de qualquer natureza) e abuso de bugs."}, {"text": "Na utilização de máscara, é proibido efetuar o reconhecimento por voz e roupa."}, {"text": "É proibido fazer qualquer tipo de modificações visuais e sonoras de maneira que obtenha alguma vantagem em relação a configuração padrão ou que interfiram diretamente na dinâmica. Ex: Modificar Citizen (Remove a noite, água, props), mod de armas (deixa armas coloridas, facilitando a visualização dela)."}, {"text": "Proibido uso de música dentro da cidade a não ser do sistema de som exclusivo da cidade."}, {"text": "É proibida a utilização de canais não oficiais (Discord, WhatsApp, TeamSpeak, chamadas de voz e similares) como meio de comunicação para realizar RP. Toda comunicação entre personagens deve ocorrer exclusivamente pelos meios disponíveis na cidade (voz, celular e rádio), sendo o descumprimento tratado como metagaming."}]}]}, {"id": "personagem", "number": 3, "title": "Regras de Personagem", "icon": "User", "description": "Diretrizes para a criação e manutenção de personagens no servidor.", "sections": [{"id": "personagem-criacao", "title": "Criação de Personagem", "rules": [{"text": "Os personagens criados por você não deverão conter nomes de cunho ofensivo ou que se enquadrem fora dos nomes reais registrados em Cartório."}, {"text": "Personagens secundários estão proibidos de compartilhar itens ou até mesmo possuir certa relação de parentesco com seu personagem principal. No entanto, se esta situação ocorrer, o player tomará banimento permanente, sem o direito a revogar."}]}]}, {"id": "punicoes", "number": 4, "title": "Sistema de Punições", "icon": "AlertTriangle", "description": "Escala de punições aplicadas pela Staff em casos de infrações das regras.", "sections": [{"id": "punicoes-escala", "title": "Advertências", "rules": [{"text": "Advertência Verbal: Cidadão recebe orientações e avisos. Remove automaticamente após 15 dias."}, {"text": "Advertência 1: Cidadão recebe orientações e avisos + serviços comunitários na prisão. Remove automaticamente após 30 dias."}, {"text": "Advertência 2: Cidadão recebe orientações e avisos + serviços comunitários na prisão. Remove automaticamente após 60 dias."}, {"text": "Advertência 3: Cidadão recebe orientações e avisos + serviços comunitários na prisão. Remove automaticamente após 90 dias."}, {"text": "Advertência 4: Banimento permanente da comunidade."}]}, {"id": "punicoes-obs", "title": "Observações Importantes", "rules": [{"text": "A quantidade de serviços depende do grau de infração cometida pelo jogador, bem como cabe SOMENTE AO STAFF RESPONSÁVEL da denúncia decidir a quantidade de serviços."}, {"text": "Infrações consideradas graves podem resultar em banimento permanente imediato, sem passar pelas etapas anteriores."}, {"text": "Toda punição pode ser recorrida através dos canais oficiais do Discord."}, {"text": "A decisão final sobre punições permanentes é exclusiva da administração do servidor."}]}]}, {"id": "regras-gerais", "number": 5, "title": "Regras Gerais", "icon": "FileText", "description": "Definições de infrações, amor à vida e regras gerais de conduta no servidor.", "sections": [{"id": "amor-a-vida", "title": "Amor à Vida (Importante)", "rules": [{"text": "Não tome atitudes que você não tomaria na vida real. Valorize a sua vida e a de outros jogadores em primeiro lugar. "}, {"text": "Não reagir a um assalto onde duas pessoas estão com uma arma apontada na sua cabeça."}, {"text": "Não reagir a uma abordagem onde dois policiais estão com uma arma apontada na sua cabeça."}, {"text": "A quebra desta regra poderá ocasionar a morte permanente do seu personagem (PD), onde terá que criar outro personagem e perderá todo o progresso, incluindo itens VIPs."}]}, {"id": "regras-gerais", "title": "Regras Gerais", "rules": [{"text": "Metagaming: Utilizar informações recebidas fora do RP (Discord, stream, chat da stream, etc) dentro do jogo. Exemplo: pegar informações de alguma live ou de um amigo para interferir em um Roleplay."}, {"text": "Random Deathmatch (RDM): É a ação de matar sem nenhum motivo, ou simplesmente pelo desejo de matar."}, {"text": "Vehicle Deathmatch (VDM): É a ação de usar veículos como arma para matar ou atropelar alguém propositalmente"}, {"text": "Combat Logging (CL): Deslogar durante uma ação em que você esteja participando direta ou indiretamente."}, {"text": "Forçar RP: Forçar alguma interação não prevista ou adequada no RP."}, {"text": "Power Gaming (PG): É a prática de abusar da mecânica do jogo para realizar algo impossível ser feito na vida real."}, {"text": "Anti RP: Ter condutas que vão contra o bom andamento do roleplay, tomar atitudes que vão contra a história do seu personagem."}, {"text": "Flaming: É qualquer interação hostil/ofensiva que inflame alguma situação ou pessoa de forma negativa, incitando o ódio, ofensas e ameaças direcionadas."}, {"text": "Cop Baiting: É proibido efetuar chamados para qualquer tipo de serviço (polícia, hospital, táxis, entre outros) com intuito de sequestrar, matar e/ou realizar qualquer ação do gênero com quem atendeu o chamado."}, {"text": "Dark RP: É qualquer discurso que se enquadre em discriminação, assédio, tortura e afins, considerados atos criminosos."}]}]}, {"id": "safezones", "number": 6, "title": "Regras da Safezone", "icon": "ShieldCheck", "description": "Áreas protegidas onde nenhum tipo de ação é permitida no servidor.", "sections": [{"id": "safezones", "title": "Safezones", "rules": [{"text": "Safe-zones são locais onde não pode acontecer nenhum tipo de AÇÃO."}, {"text": "Safezones: Hospital, Mecânica, Delegacia, Batalhões."}]}]}, {"id": "empregos", "number": 7, "title": "Regras de Empregos", "icon": "Briefcase", "description": "Regras e responsabilidades para todos os funcionários de empregos legais.", "sections": [{"id": "empregos", "title": "Empregos", "rules": [{"text": "Proibido utilizar os veículos de empregos legais para qualquer atividade fora do emprego legal."}, {"text": "Proibido abandonar veículos de serviços."}, {"text": "Não é permitido o uso de máscara em serviço."}, {"text": "Todo e qualquer candidato a um emprego legal estará sujeito a uma avaliação médica."}, {"text": "Proibido fazer ações ilegais estando contratado em um serviço legal, passível de banimento."}]}, {"id": "empregos-uber", "title": "Uber", "rules": [{"text": "Só é permitido aceitar corridas em veículo de quatro rodas com assento para passageiro. Proibido atender corrida de motocicleta."}, {"text": "Proibido utilizar veículos esportivos, superesportivos ou blindados para atender corridas."}, {"text": "Proibido utilizar o aplicativo como isca. Nem o motorista pode assaltar, sequestrar ou levar o passageiro a uma emboscada, nem o passageiro pode solicitar corrida para atrair o motorista. Passível de banimento."}, {"text": "Proibido transportar pessoas em fuga, procurados ou material ilícito durante uma corrida."}, {"text": "Proibido cobrar qualquer valor por fora do aplicativo."}, {"text": "Proibido aceitar uma corrida e não comparecer ao local do passageiro."}, {"text": "Proibido solicitar corrida para local inacessível ou área de conflito ativo."}]}, {"id": "empregos-ifood", "title": "iFood", "rules": [{"text": "As entregas só podem ser realizadas de motocicleta ou bicicleta. Proibido entregar a pé ou de carro."}, {"text": "Proibido utilizar o aplicativo como isca. Nem o entregador pode assaltar o cliente, nem o cliente pode solicitar pedido para atrair o entregador. Passível de banimento."}, {"text": "Proibido abrir, consumir, vender ou descartar o pedido do cliente."}, {"text": "Proibido utilizar as entregas para transportar itens ilícitos."}, {"text": "Proibido cobrar qualquer valor por fora do aplicativo."}, {"text": "Proibido aceitar um pedido e abandonar a entrega."}, {"text": "Proibido solicitar entrega para local inacessível ou área de conflito ativo."}, {"text": "Estar em serviço de entrega não justifica fuga de abordagem policial nem descumprimento das leis de trânsito."}]}]}, {"id": "hospital", "number": 8, "title": "UPA/24h", "icon": "HeartPulse", "description": "Regras de conduta e procedimentos dentro e nas dependências da UPA/24h.", "sections": [{"id": "empregos", "title": "UPA/24h", "rules": [{"text": "Proibido estacionar veículos nas áreas reservadas para ambulâncias e na frente do hospital (sujeito a multa e guincho)."}, {"text": "Proibido utilizar equipamentos sonoros nas dependências do hospital."}, {"text": "Proibido entrar sem camisa no hospital."}, {"text": "Prezamos a ordem e organização dentro do hospital. Pacientes, visitantes e funcionários devem evitar correr, brigar ou causar algum transtorno dentro do hospital."}, {"text": "Qualquer caso desconfortável que acontecer, seja com pacientes quanto funcionários, deve ser informado à diretoria para que seja resolvido."}, {"text": "É proibido o abandono ou permanência de mais de 15 minutos de veículos no território do hospital sob risco de ser guinchado."}]}]}, {"id": "juridico", "number": 9, "title": "Jurídico", "icon": "Gavel", "description": "Direitos, deveres e procedimentos do sistema jurídico da cidade.", "sections": [{"id": "juridico", "title": "Jurídico", "rules": [{"text": "Proibido todo e qualquer tipo de corrupção dentro do Jurídico."}, {"text": "Proibido funcionários do Jurídico se envolverem em qualquer tipo de ação ilegal."}, {"text": "Atender os cidadãos de forma justa e imparcial."}, {"text": "Na presença de um advogado, o réu tem o direito de reduzir a pena e a multa em até 30%."}, {"text": "A Polícia Civil não pode se recusar a colaborar com os advogados, ou privar o detento de um advogado, sujeito a ser investigado pela corregedoria."}, {"text": "Processos podem ser abertos desde que você tenha provas e testemunhas do ocorrido."}]}]}, {"id": "mecanica", "number": 10, "title": "Mecânica", "icon": "Wrench", "description": "Regras de conduta para clientes e funcionários nas dependências da Mecânica.", "sections": [{"id": "mecanica", "title": "Mecânica", "rules": [{"text": "Proibido sequestrar ou matar mecânicos em serviço"}, {"text": "Proibido entrar em locais restritos da Mecânica sem a autorização de um Mecânico."}, {"text": "Prezamos a ordem e organização dentro da Mecânica. Clientes, visitantes e funcionários devem evitar correr, brigar ou causar algum transtorno dentro da Mecânica."}, {"text": "Proibido utilizar equipamentos sonoros nas dependências da Mecânica."}]}]}, {"id": "aplicativos-e-chamados", "number": 11, "title": "Aplicativos e Chamados", "icon": "Smartphone", "description": "Regras para uso das redes sociais e para realização de chamados no servidor.", "sections": [{"id": "redes-sociais", "title": "Redes Sociais", "rules": [{"text": "Proibido a criação de contas fakes."}, {"text": "Proibido postagens que envolvam pessoas reais ou contenham conteúdo externo e explícito."}]}, {"id": "chamados", "title": "Chamados", "rules": [{"text": "Todos os chamados deverão conter uma descrição da situação e/ou o problema."}, {"text": "Todo e qualquer chamado do tipo: “Me ajude”, \"Socorro\", \"Vem cá\", \"Preciso conversar” e similares serão ignorados."}]}]}, {"id": "ilegal", "number": 12, "title": "Regras do Ilegal", "icon": "Target", "description": "Regulamentos para atividades ilegais, facções e crimes organizados no servidor.", "sections": [{"id": "comunidades", "title": "Comunidades", "rules": [{"text": "A polícia poderá realizar o patrulhamento na comunidade abertamente."}, {"text": "Não é permitido o loot de policiais."}, {"text": "Fica totalmente proibida a utilização de submetralhadoras e fuzil em motos."}, {"text": "Fica totalmente proibida a utilização de mochila/cores para identificação."}, {"text": "Levar o roleplay Paulista à risca, aprenda a se vestir/se comportar."}]}, {"id": "acoes", "title": "Ações", "rules": [{"text": "Não é permitido fazer aliança."}, {"text": "Somente é permitido o loot caso você esteja envolvido com ação."}, {"text": "Não é permitido o uso de capacetes em ações fechadas."}, {"text": "Não é permitido usar comandos em nenhum momento da ação como /dormir, /deitar."}, {"text": "Não é permitido invadir ação de terceiros, passível de advertência."}, {"text": "Para toda ação com refém, é necessário negociação."}]}, {"id": "acoes-de-rua", "title": "Ações de Rua", "rules": [{"text": "Proibido utilizar armas em registradoras, caixas eletrônicos e corridas ilegais, pois os mesmos são prioritários para fuga."}, {"text": "O RP deve ser sempre mantido, chegar e apenas matar será considerado RDM."}, {"text": "A partir do momento que a equipe médica chegar no local, fica proibido qualquer tipo de resgate ou continuidade da ação."}, {"text": "Não é permitido o uso de helicóptero em ação de rua."}, {"text": "Jogadores que forem feridos ou mortos durante uma ação, ficarão proibidos de participar da continuação desse RP, mesmo que ele ainda não tenha sido finalizado por ambas as partes."}, {"text": "O /GG só é permitido após os vencedores terminarem de lootear."}, {"text": "Só é permitido o uso do /GG caso não tenha players por perto."}, {"text": "Ao receber voz de parada, fica totalmente proibido somente atirar, necessário uma breve fuga caso o interesse seja trocar tiro, tanto em assalto quanto em abordagens."}, {"text": "Fica proibido o resgate de membros da facção, só será permitido o resgate de líderes."}]}, {"id": "pinotes", "title": "Pinotes", "rules": [{"text": "Em caso de resgate em pinote, a polícia poderá realizar disparos não letais no pneu do veículo."}]}, {"id": "assaltos", "title": "Assaltos", "rules": [{"text": "O horário de assalto segue das 00:00 às 05:00"}, {"text": "É permitido somente pistola para assaltar (exceto glock 18C)."}, {"text": "Não é permitido roubar itens que sejam de VIP (Vale Concessionária, Vale Veículo, Mochila e afins.)"}, {"text": "Proibido assaltar em comboio, ou seja, com mais de 1 veículo envolvido (carro ou moto)."}]}, {"id": "resgates", "title": "Resgates de Prisão", "rules": [{"text": "O armamento é livre"}, {"text": "Os bandidos têm autonomia para interceptar a polícia em qualquer local antes de chegar no perímetro do presídio, desde que respeitem as regras de ações de rua."}]}, {"id": "rebeliao", "title": "Rebelião", "rules": [{"text": "Fica proibido o uso de helicópteros pelos bandidos em rebelião no presídio."}, {"text": "Uso obrigatório de pistola ou fuzil."}]}, {"id": "racha-de-rua", "title": "Racha de Rua", "rules": [{"text": "Proibido o uso de qualquer tipo de armamento em corridas ilegais."}, {"text": "A prioridade é o RP de perseguição e fuga, tanto para polícia quanto para os corredores"}]}, {"id": "decretos", "title": "Decretos", "rules": [{"text": "Todo membro/líder de facção, está proibido de lembrar qualquer coisa referente ao ILEGAL quando ser decretado pelo PCC."}, {"text": "O PCC poderá analisar cada caso e definir se o decreto acarretará ou não a perda do personagem."}]}, {"id": "sequestros", "title": "Sequestros", "rules": [{"text": "Sequestros são permitidos em qualquer horário do jogo, mas se for fora do horário de assalto não é permitido roubar nenhum pertence ou veículo do mesmo."}, {"text": "Proibido sequestrar jogadores sem o uso da algema."}, {"text": "Proibido sequestrar em área safe."}, {"text": "Não será tolerado sequestro com motocicletas."}, {"text": "Somente 2 sequestrados por vez no porta-malas de cada veículo."}, {"text": "O número de sequestradores sempre deve ser maior que a quantidade de jogadores que estão sendo sequestrados."}, {"text": "É permitida a retirada de celulares e rádios das vítimas."}, {"text": "É obrigatório seguir o RP quando estiver abordando ou sendo abordado pelo sequestrado/sequestrador."}, {"text": "O sequestrador não poderá executar o refém se o mesmo estiver colaborando."}, {"text": "O sequestrado sempre deve seguir a história que está ocorrendo no momento, policiais e bandidos devem sempre tentar preservar a vida do refém."}, {"text": "Todo refém pode ser revistado e interrogado após soltura."}, {"text": "Um sequestro pode acontecer somente para ação ou cobranças em específico."}, {"text": "Toda negociação deve ser seguida por ambas as partes até o final da ação."}, {"text": "Caso o sequestro envolva dinheiro, o valor máximo permitido por pessoa para pedido é de R$100.000 sujo."}]}]}, {"id": "policia", "number": 13, "title": "Regras da Polícia", "icon": "Siren", "description": "Protocolos e procedimentos operacionais para policiais em serviço.", "sections": [{"id": "policia-gerais", "title": "Regras Gerais", "rules": [{"text": "Fica totalmente proibido a utilização de submetralhadoras e fuzil no P1 dos veículos e nas motos."}, {"text": "Após morrer, está proibido voltar no local até o final da ação."}, {"text": "Fica totalmente proibido RP de corrupção envolvendo itens."}, {"text": "Fica proibido policial do sexo masculino realizar revista em personagem do sexo feminino, devendo a revista ser conduzida por uma policial feminina."}, {"text": "Durante um pinote, se o pneu da viatura furar, a viatura capotar ou acabar a gasolina, fica proibido voltar ao pinote."}, {"text": "Se uma motocicleta cair durante um pinote, a unidade toda deve dar QTA. Uma unidade é formada por 2 ou 3 motos: se uma cair, todas saem do pinote."}, {"text": "Fica proibido mais de uma unidade de motos no mesmo pinote."}]}]}, {"id": "roubos", "number": 14, "title": "Regras de Roubos", "icon": "Banknote", "description": "Regras, limites e composição permitida em cada tipo de assalto no servidor.", "sections": [{"id": "roubos-fuga", "title": "Roubos de fuga", "icon": "Wallet", "group": "Fuga", "places": ["Registradora", "Caixa Eletrônico", "Pedestres", "Porta-Malas", "Casas"], "sheet": {"police": "3 viaturas e 1 helicóptero", "weapons": "Proibido arma de fogo"}, "rules": [{"text": "Ação feita para valorizar a fuga."}]}, {"id": "ammunation", "title": "Loja de Armas e Conveniências", "icon": "Store", "group": "Pequeno porte", "sheet": {"robbers": "2 a 3", "police": "+1", "hostages": "até 1", "weapons": "Pistola (ambas as partes)", "negotiation": true}, "rules": []}, {"id": "cargas", "title": "Cargas", "icon": "Package", "group": "Pequeno porte", "sheet": {"robbers": "2 a 3", "police": "até 3 viaturas", "weapons": "Pistola (ambas as partes)", "negotiation": false}, "rules": []}, {"id": "carro-forte", "title": "Carro Forte", "icon": "Truck", "group": "Médio porte", "sheet": {"robbers": "3 a 4", "police": "até 3 viaturas (8 policiais)", "weapons": "Submetralhadora ou fuzil", "negotiation": false}, "rules": []}, {"id": "container", "title": "Navio", "icon": "Ship", "group": "Médio porte", "sheet": {"robbers": "3 a 5", "police": "+2", "hostages": "até 1", "weapons": "Pistola", "negotiation": true}, "rules": []}, {"id": "porto", "title": "Porto", "icon": "Anchor", "group": "Grande porte", "sheet": {"robbers": "4 a 6", "police": "+5", "hostages": "até 2", "weapons": "Submetralhadora ou fuzil", "negotiation": true}, "rules": []}, {"id": "joalheria", "title": "Joalheria", "icon": "Gem", "group": "Grande porte", "sheet": {"robbers": "5 a 7", "police": "+3", "hostages": "até 3", "weapons": "Submetralhadora ou fuzil", "negotiation": true}, "rules": []}, {"id": "banco-central", "title": "Banco Central", "icon": "Landmark", "group": "Grande porte", "sheet": {"robbers": "8 a 10", "police": "+3", "hostages": "até 4", "weapons": "Fuzil", "negotiation": true}, "rules": []}]}, {"id": "consideracoes", "number": 15, "title": "Considerações Finais", "icon": "CheckCircle2", "description": "Disposições finais e o compromisso de todos com as regras da Divisa SP.", "sections": [{"id": "consideracoes", "title": "Considerações Finais", "rules": [{"text": "Todas as regras acima descritas deverão ser cumpridas sem exceções, o rompimento de qualquer uma delas acarretará punições determinadas única e exclusivamente pela administração da Divisa SP."}]}]}];buildIndex();render();</script></body></html>
